<article
  class="mail-card"
  [class.selected]="selected"
>

  <img [src]="mail.avatar" alt="">

  <div class="content">

    <div class="top">
      <h4>{{ mail.name }}</h4>
      <span>{{ mail.day }} {{ mail.time }}</span>
    </div>

    <h5>{{ mail.title }}</h5>

    <p>{{ mail.message }}</p>

    @if(mail.name === 'Sam Miller'){
      <div class="attachment-link">
        4 Attachments
      </div>
    }

  </div>

</article>
